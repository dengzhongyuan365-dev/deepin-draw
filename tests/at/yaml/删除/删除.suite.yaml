name: 删除_suite
app: deepin-draw
module: 删除
setup:
- action: session_start
  command: deepin-draw
  wait: 3.0
suites:
- id: suite_删除_001_s1
  name: '[059][acp1][smoke]右键菜单-删除'
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Rectangle tool button
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: e
  - step_type: action
    action: dtk_context_menu
    selector:
      name: MainWindow
    items:
    - 删除
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Rectangle tool button
- id: suite_删除_002_s1
  name: '[112][acp1][smoke]删除快捷键-Delet'
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Rectangle tool button
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: delete
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Rectangle tool button
- id: suite_删除_003_s1
  name: 属性栏-删除图元后属性栏变化
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Rectangle tool button
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: fill color button
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: delete
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Rectangle tool button
teardown:
- action: session_stop
