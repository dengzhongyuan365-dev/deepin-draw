  - step_type: action
    action: element_action
    selector:
      name: Rectangle tool button
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: fill color button
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: r
  - step_type: action
    action: element_action
    selector:
      accessible_id: PickColorWidget
    do: click
    wait: 1.0
  assert_steps:
