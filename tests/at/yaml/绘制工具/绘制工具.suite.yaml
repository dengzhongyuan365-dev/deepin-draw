    action: element_action
    selector:
      name: Rectangle tool button
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: fill color button
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: e
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Rectangle tool button
- id: suite_绘制工具_008_s1
  name: '[363][smoke][acp1]矩形-属性-粗细'
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Rectangle tool button
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: stroken color button
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      accessible_id: ExpBtn
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: e
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Rectangle tool button
- id: suite_绘制工具_013_s1
  name: '[011][smoke]矩形-修改属性后绘制'
