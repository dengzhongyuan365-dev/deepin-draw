  name: '[002、108][smoke]打开-桌面双击ddf文件打开'
  description: ''
  steps:
  - step_type: action
    action: keyboard_press
    key: e
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: MultipTabBarWidget
- id: suite_打开关闭_002_s1
  name: 打开-使用画板打开不支持格式的图片
  description: ''
  steps:
