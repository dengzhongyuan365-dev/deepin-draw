    action: dtk_context_menu
    selector:
      name: MainWindow
    items:
    - 属性
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: MultipTabBarWidget
- id: suite_打开关闭_003_s1
  name: '[388][smoke][acp1]打开-使用画板打开支持格式的图片'
  description: ''
  steps:
  - step_type: action
    action: keyboard_press
    key: e
  - step_type: action
    action: dtk_context_menu
    selector:
      name: MainWindow
    items:
    - 属性
  assert_steps:
  - step_type: assert
