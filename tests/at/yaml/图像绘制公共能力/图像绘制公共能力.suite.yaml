name: 图像绘制公共能力_suite
app: deepin-draw
module: 图像绘制公共能力
setup:
- action: session_start
  command: deepin-draw
  wait: 3.0
suites:
- id: suite_图像绘制公共能力_001_s1
  name: '[smoke][acp1]画笔-绘制画笔图案'
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Pencil tool button
      role: push button
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: e
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Pencil tool button
      role: push button
- id: suite_图像绘制公共能力_002_s1
  name: 画笔-默认属性
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Pencil tool button
      role: push button
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Pencil tool button
      role: push button
- id: suite_图像绘制公共能力_007_s1
  name: 样式-修改矩形图案样式属性
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Rectangle tool button
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      accessible_id: ExpBtn
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: p
  - step_type: action
    action: dtk_context_menu
    selector:
      name: MainWindow
    items:
    - 属性
  - step_type: action
    action: element_action
    selector:
      accessible_id: Width Label
    do: focus
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: CSideWidthWidget
    do: focus
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: CSpinBox
    do: focus
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: CTextEdit
    do: focus
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: AttrSpinBox
    do: focus
    wait: 0.3
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Rectangle tool button
teardown:
- action: session_stop
